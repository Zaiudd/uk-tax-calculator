name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Stage 1: check code quality and run the tests
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check code quality
        run: ruff check .
      - name: Run tests
        run: pytest -v

  # Stage 2: build the Docker container and check the app starts inside it
  docker:
    name: Build and smoke-test container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t uk-tax-calculator .
      - name: Start container
        run: docker run -d -p 8501:8501 --name app uk-tax-calculator
      - name: Check the app responds
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo " - app is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1

  # Stage 3: only if everything passed, release the code to the live website
  deploy:
    name: Release to deploy branch
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push tested code to the deploy branch
        run: git push origin HEAD:deploy --force
